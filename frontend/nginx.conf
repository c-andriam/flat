# Configuration du conteneur frontend : sert le build statique de la SPA.
# Le routage /api et /ws reste assuré par la gateway en amont.

server {
    listen 80;
    # Sans cette ligne, nginx n'écoute qu'en IPv4 : dans le conteneur
    # `localhost` résout d'abord en ::1, et toute sonde qui l'utilise
    # reçoit un « connection refused ».
    listen [::]:80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Sans ça, nginx sert tout en application/octet-stream et le navigateur
    # refuse d'appliquer le CSS ou d'exécuter les modules JS.
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript
               application/wasm text/xml application/xml image/svg+xml;

    # Les assets générés par Vite portent un hash de contenu : leur nom change
    # dès que leur contenu change, ils peuvent donc être mis en cache à vie.
    location /assets/ {
        # Une seule directive : `expires` en émettait une seconde, et deux
        # en-têtes Cache-Control sur la même réponse sont une invitation aux
        # divergences entre navigateurs.
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # index.html ne doit jamais être mis en cache : c'est lui qui référence
    # les noms hashés du déploiement courant.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    # Toute route inconnue retombe sur la SPA : le routeur client prend le
    # relais, ce qui rend /projets/<uuid> rechargeable directement.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }
}

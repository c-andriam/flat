<!doctype html>
<html lang="fr" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="description" content="Espace de pilotage des projets et actions — Direction des Systèmes d'Information, TRIMETA Group." />
    <title>DSI TRIMETA Group</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <script>
      /* Appliqué avant le premier rendu : sinon la page clignote en sombre
         puis bascule en clair chez les utilisateurs en thème clair. */
      ;(function () {
        try {
          var stored = localStorage.getItem('dsio-theme')
          var system = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'
          var theme = stored === 'light' || stored === 'dark' ? stored : system
          document.documentElement.classList.toggle('dark', theme === 'dark')
          document.documentElement.style.colorScheme = theme
        } catch (_) {
          /* localStorage indisponible (navigation privée) : on garde le sombre par défaut. */
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

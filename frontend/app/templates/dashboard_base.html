{% extends "base.html" %}

{% block content %}
<style>
    /* Override base main styles for full-width dashboard layout */
    .app-main {
        align-items: flex-start !important;
        justify-content: flex-start !important;
        max-width: 100% !important; /* Full width as requested */
        padding: 32px 32px 72px !important;
        flex-direction: row !important;
        gap: 32px;
    }

    @media (max-width: 768px) {
        .app-main {
            flex-direction: column !important;
            padding: 24px 16px 72px !important;
        }
    }

    /* Sidebar Styles */
    .sidebar {
        width: 240px;
        flex-shrink: 0;
        display: flex;
        flex-direction: column;
        gap: 8px;
    }
    
    @media (max-width: 768px) {
        .sidebar {
            width: 100%;
            flex-direction: row;
            overflow-x: auto;
            padding-bottom: 16px;
            margin-bottom: 16px;
            border-bottom: 1px solid var(--border-default);
        }
    }

    .nav-item {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 8px 12px;
        border-radius: 6px;
        color: var(--text-secondary);
        text-decoration: none;
        font-size: 14px;
        font-weight: 500;
        transition: all 0.2s ease;
    }
    .nav-item svg { width: 16px; height: 16px; }
    
    .nav-item:hover {
        background: var(--bg-surface-hover);
        color: var(--text-primary);
    }
    
    .nav-item.active {
        background: var(--accent-blue-subtle);
        color: var(--accent-blue);
        font-weight: 600;
    }

    /* Dashboard Content Container */
    .dashboard-content {
        flex: 1;
        width: 100%;
        min-width: 0;
    }

    /* Common Dashboard Header */
    .page-header {
        margin-bottom: 24px;
        display: flex;
        justify-content: space-between;
        align-items: center;
    }
    .page-title {
        font-size: 24px;
        font-weight: 600;
        color: var(--text-primary);
        letter-spacing: -0.01em;
    }
    
    /* Common empty state */
    .empty-state {
        padding: 48px 24px;
        text-align: center;
        background: var(--bg-surface);
        border: 1px dashed var(--border-default);
        border-radius: 8px;
        color: var(--text-secondary);
        font-size: 14px;
    }
</style>

<!-- Sidebar Navigation -->
<aside class="sidebar anim-1">
    <a href="/dashboard" class="nav-item {% if active_page == 'dashboard' %}active{% endif %}">
        <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
        Vue d'ensemble
    </a>
    <a href="/projects" class="nav-item {% if active_page == 'projects' %}active{% endif %}">
        <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
        Projets
    </a>
    <a href="/actions" class="nav-item {% if active_page == 'actions' %}active{% endif %}">
        <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 20V10"/><path d="M18 20V4"/><path d="M6 20v-4"/></svg>
        Actions
    </a>
    <a href="/agenda" class="nav-item {% if active_page == 'agenda' %}active{% endif %}">
        <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
        Agenda
    </a>
    <a href="/responsables" class="nav-item {% if active_page == 'responsables' %}active{% endif %}">
        <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
        Responsables
    </a>
    <a href="/rapports" class="nav-item {% if active_page == 'rapports' %}active{% endif %}">
        <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M21.21 15.89A10 10 0 1 1 8 2.83"/><path d="M22 12A10 10 0 0 0 12 2v10z"/></svg>
        Rapports
    </a>
    <a href="/slots" class="nav-item {% if active_page == 'slots' %}active{% endif %}">
        <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/><line x1="10" y1="14" x2="14" y2="14"/><line x1="12" y1="12" x2="12" y2="16"/></svg>
        Prise de RDV
    </a>
</aside>

<!-- Main Dashboard Content Area -->
<div class="dashboard-content">
    {% block dashboard_content %}{% endblock %}
</div>
{% endblock %}

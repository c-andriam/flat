{# Fragment rendered by GET /api/modal/new-action and injected into #modal-root #}
{% from "macros/modal.html" import modal %}

{% call(content) modal("Nouvelle Action", show_footer=true) %}
<div style="display: flex; flex-direction: column; gap: 16px;">
    <div>
        <label style="display: block; font-size: 13px; font-weight: 500; color: var(--text-secondary); margin-bottom: 6px;">Titre de l'action</label>
        <input type="text" placeholder="Ex: Mise à jour des serveurs"
               style="width: 100%; padding: 10px 12px; border-radius: 6px; border: 1px solid var(--border-default); background: var(--bg-primary); color: var(--text-primary); font-size: 14px; font-family: inherit; outline: none; transition: border-color 0.2s ease;"
               onfocus="this.style.borderColor='var(--accent-blue)'" onblur="this.style.borderColor='var(--border-default)'">
    </div>
    <div>
        <label style="display: block; font-size: 13px; font-weight: 500; color: var(--text-secondary); margin-bottom: 6px;">Description</label>
        <textarea rows="3" placeholder="Décrivez l'action à réaliser..."
                  style="width: 100%; padding: 10px 12px; border-radius: 6px; border: 1px solid var(--border-default); background: var(--bg-primary); color: var(--text-primary); font-size: 14px; font-family: inherit; outline: none; resize: vertical; transition: border-color 0.2s ease;"
                  onfocus="this.style.borderColor='var(--accent-blue)'" onblur="this.style.borderColor='var(--border-default)'"></textarea>
    </div>
    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px;">
        <div>
            <label style="display: block; font-size: 13px; font-weight: 500; color: var(--text-secondary); margin-bottom: 6px;">Priorité</label>
            <select style="width: 100%; padding: 10px 12px; border-radius: 6px; border: 1px solid var(--border-default); background: var(--bg-primary); color: var(--text-primary); font-size: 14px; font-family: inherit; outline: none;">
                <option>Normale</option>
                <option>Haute</option>
                <option>Urgente</option>
            </select>
        </div>
        <div>
            <label style="display: block; font-size: 13px; font-weight: 500; color: var(--text-secondary); margin-bottom: 6px;">Échéance</label>
            <input type="date"
                   style="width: 100%; padding: 10px 12px; border-radius: 6px; border: 1px solid var(--border-default); background: var(--bg-primary); color: var(--text-primary); font-size: 14px; font-family: inherit; outline: none;">
        </div>
    </div>
</div>
{% endcall %}

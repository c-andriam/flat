{# 
  BREADCRUMB MACRO
#}
{% macro breadcrumb(items) %}
<nav aria-label="Breadcrumb" class="breadcrumb anim-1">
    <ol class="breadcrumb__list">
        {% for item in items %}
            <li class="breadcrumb__item">
                {% if item.url %}
                    <a href="{{ item.url }}" class="breadcrumb__link">{{ item.label }}</a>
                {% else %}
                    <span class="breadcrumb__current" aria-current="page">{{ item.label }}</span>
                {% endif %}
                
                {% if not loop.last %}
                <svg class="breadcrumb__separator" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                    <polyline points="9 18 15 12 9 6"></polyline>
                </svg>
                {% endif %}
            </li>
        {% endfor %}
    </ol>
</nav>
{% endmacro %}

{# 
  EMPTY STATE MACRO
#}
{% macro empty_state(icon, title, message, action_label=None, action_url=None) %}
<div class="empty-state">
    <div class="empty-state__icon">
        {{ icon | safe }}
    </div>
    <h3 class="empty-state__title">{{ title }}</h3>
    <p class="empty-state__message">{{ message }}</p>
    
    {% if action_label and action_url %}
    <div style="margin-top: 24px;">
        <a href="{{ action_url }}" class="btn btn-primary" style="padding: 8px 16px; font-size: 13px;">
            {{ action_label }}
        </a>
    </div>
    {% endif %}
</div>
{% endmacro %}

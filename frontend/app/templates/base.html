<!DOCTYPE html>
<html lang="fr" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}DSI TRIMETA Group{% endblock %}</title>

    <!-- Google Fonts - Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Compiled Tailwind CSS -->
    <link href="/static/css/output.css" rel="stylesheet">

    <!-- HTMX -->
    <script src="https://unpkg.com/htmx.org@1.9.10" integrity="sha384-D1Kt99CQMDuVetoL1lrYwg5t+9QdHe7NLX/SoJYkXDFfX37iInKRy5xLSi8nO7UC" crossorigin="anonymous"></script>

    <!-- HTMX Configuration for Premium View Transitions -->
    <meta name="htmx-config" content='{"globalViewTransitions":true}'>

    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --bg-primary: #ffffff;
            --bg-surface: #f6f8fa;
            --bg-surface-hover: #eaeef2;
            --bg-inset: #eff2f5;
            --border-default: #d0d7de;
            --border-subtle: #e8ebef;
            --text-primary: #24292f;
            --text-secondary: #57606a;
            --text-muted: #8c959f;
            --accent-blue: #0969da;
            --accent-blue-subtle: rgba(9,105,218,0.08);
            --accent-green: #1a7f37;
            --accent-green-hover: #2c974b;
            --accent-green-subtle: rgba(26,127,55,0.08);
            --accent-orange: #bc4c00;
            --accent-orange-subtle: rgba(188,76,0,0.08);
            --accent-red: #cf222e;
            --accent-red-subtle: rgba(207,34,46,0.06);
            --shadow-sm: 0 1px 2px rgba(27,31,36,0.04);
            --shadow-md: 0 4px 12px rgba(140,149,159,0.12);
            --shadow-lg: 0 12px 32px rgba(140,149,159,0.15);
        }

        html.dark {
            --bg-primary: #0d1117;
            --bg-surface: #161b22;
            --bg-surface-hover: #1c2129;
            --bg-inset: #010409;
            --border-default: #30363d;
            --border-subtle: #21262d;
            --text-primary: #e6edf3;
            --text-secondary: #8b949e;
            --text-muted: #6e7681;
            --accent-blue: #58a6ff;
            --accent-blue-subtle: rgba(88,166,255,0.1);
            --accent-green: #3fb950;
            --accent-green-hover: #56d364;
            --accent-green-subtle: rgba(63,185,80,0.1);
            --accent-orange: #d29922;
            --accent-orange-subtle: rgba(210,153,34,0.1);
            --accent-red: #f85149;
            --accent-red-subtle: rgba(248,81,73,0.1);
            --shadow-sm: 0 1px 2px rgba(0,0,0,0.2);
            --shadow-md: 0 4px 12px rgba(0,0,0,0.3);
            --shadow-lg: 0 12px 32px rgba(0,0,0,0.4);
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
            background-color: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            transition: background-color 0.4s cubic-bezier(0.2, 0.8, 0.2, 1), color 0.4s ease;
        }

        /* ─── Header ─── */
        .app-header {
            background: var(--bg-surface);
            border-bottom: 1px solid var(--border-default);
            padding: 0 24px;
            height: 64px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 50;
            transition: background-color 0.4s ease, border-color 0.4s ease;
        }

        .app-logo {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
            color: var(--text-primary);
            transition: color 0.2s ease, transform 0.2s cubic-bezier(0.2, 0.8, 0.2, 1);
        }
        .app-logo:hover { 
            color: var(--accent-blue); 
            transform: scale(1.02);
        }

        .logo-text {
            font-weight: 700;
            font-size: 15px;
            letter-spacing: -0.01em;
        }
        .logo-separator {
            width: 1px;
            height: 20px;
            background: var(--border-default);
        }
        .logo-sub {
            font-weight: 400;
            font-size: 14px;
            color: var(--text-secondary);
        }

        .nav-actions { display: flex; align-items: center; gap: 8px; }

        .theme-toggle {
            width: 36px; height: 36px;
            display: flex; align-items: center; justify-content: center;
            border-radius: 6px;
            border: 1px solid var(--border-default);
            background: transparent;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.2, 0.8, 0.2, 1);
        }
        .theme-toggle:hover {
            background: var(--bg-surface-hover);
            color: var(--text-primary);
            border-color: var(--text-muted);
            transform: translateY(-1px);
        }
        .theme-toggle:active {
            transform: translateY(1px) scale(0.95);
        }
        .theme-toggle svg { width: 18px; height: 18px; }

        html.dark .icon-sun { display: block; }
        html.dark .icon-moon { display: none; }
        html:not(.dark) .icon-sun { display: none; }
        html:not(.dark) .icon-moon { display: block; }

        /* ─── Main ─── */
        .app-main {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 56px 24px 72px;
            max-width: 1000px;
            width: 100%;
            margin: 0 auto;
        }

        /* ─── Footer ─── */
        .app-footer {
            padding: 20px 24px;
            text-align: center;
            font-size: 12px;
            color: var(--text-muted);
            border-top: 1px solid var(--border-default);
            transition: border-color 0.4s ease;
        }

        /* ─── SPA Loader ─── */
        .spa-loader {
            position: fixed;
            top: 0; left: 0; right: 0;
            height: 3px;
            background: var(--accent-blue);
            z-index: 9999;
            transform: scaleX(0);
            transform-origin: left;
            transition: transform 0.2s ease, opacity 0.2s ease;
            pointer-events: none;
            opacity: 0;
        }
        body.htmx-request .spa-loader {
            opacity: 1;
            transform: scaleX(0.7);
            transition: transform 3s cubic-bezier(0.1, 0.5, 0.2, 1), opacity 0.2s ease;
        }

        /* ─── Ultra-Discreet Enterprise Transitions ─── */
        /* Remove cascading entrance animations to avoid double-fading with View Transitions */
        .anim-1, .anim-2, .anim-3, .anim-4 { 
            /* Elements appear instantly in the DOM, allowing View Transitions to handle the pure cross-fade */
            opacity: 1; 
        }
        
        /* Native Browser View Transitions (Cross-fade between SPA pages) */
        ::view-transition-old(root),
        ::view-transition-new(root) {
            animation-duration: 0.15s; /* Ultra-fast 150ms snap */
            animation-timing-function: ease-out;
            mix-blend-mode: normal; /* Prevents visual artifacts during color blending */
        }

        /* ─── Buttons ─── */
        .btn {
            display: inline-flex; align-items: center; justify-content: center; gap: 8px;
            padding: 10px 20px;
            font-size: 14px; font-weight: 600; font-family: inherit;
            border-radius: 6px;
            border: 1px solid transparent;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.15s ease;
            line-height: 1.4;
        }
        .btn svg { flex-shrink: 0; }

        .btn-primary {
            background: var(--accent-green);
            color: #ffffff;
            border-color: rgba(0,0,0,0.15);
        }
        .btn-primary:hover { background: var(--accent-green-hover); }

        .btn-secondary {
            background: var(--bg-surface);
            color: var(--text-primary);
            border-color: var(--border-default);
        }
        .btn-secondary:hover { background: var(--bg-surface-hover); }

        /* ─── Cards ─── */
        .stat-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 16px;
            width: 100%;
        }
        @media (max-width: 768px) {
            .stat-grid { grid-template-columns: repeat(2, 1fr); }
        }
        @media (max-width: 480px) {
            .stat-grid { grid-template-columns: 1fr; }
        }

        .stat-card {
            background: var(--bg-surface);
            border: 1px solid var(--border-default);
            border-radius: 8px;
            padding: 20px;
            text-align: left;
            transition: border-color 0.2s ease, box-shadow 0.2s ease, background-color 0.25s ease;
        }
        .stat-card:hover {
            border-color: var(--text-muted);
            box-shadow: var(--shadow-md);
        }

        .stat-icon {
            width: 36px; height: 36px;
            border-radius: 8px;
            display: flex; align-items: center; justify-content: center;
            margin-bottom: 14px;
        }
        .stat-icon svg { width: 18px; height: 18px; }

        .stat-icon.blue   { background: var(--accent-blue-subtle);   color: var(--accent-blue); }
        .stat-icon.green  { background: var(--accent-green-subtle);  color: var(--accent-green); }
        .stat-icon.orange { background: var(--accent-orange-subtle); color: var(--accent-orange); }
        .stat-icon.red    { background: var(--accent-red-subtle);    color: var(--accent-red); }

        .stat-label {
            font-size: 12px;
            font-weight: 500;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.04em;
            margin-bottom: 4px;
        }
        .stat-value {
            font-size: 28px;
            font-weight: 700;
            color: var(--text-primary);
            letter-spacing: -0.03em;
            line-height: 1.2;
        }

        /* ─── Divider ─── */
        .section-divider {
            width: 100%;
            height: 1px;
            background: var(--border-default);
            margin: 48px 0;
            transition: background-color 0.25s ease;
        }
    </style>

    <script>
        if (localStorage.theme === 'light') {
            document.documentElement.classList.remove('dark');
        }
        function toggleTheme() {
            const h = document.documentElement;
            if (h.classList.contains('dark')) { h.classList.remove('dark'); localStorage.theme = 'light'; }
            else { h.classList.add('dark'); localStorage.theme = 'dark'; }
        }
    </script>
</head>
<body hx-boost="true">

    <div class="spa-loader"></div>

    <!-- Header -->
    <header class="app-header">
        <a href="/" class="app-logo">
            <span class="logo-text">DSI TRIMETA</span>
            <span class="logo-separator"></span>
            <span class="logo-sub">Gestion de Projet</span>
        </a>
        <div class="nav-actions">
            <button onclick="toggleTheme()" class="theme-toggle" aria-label="Basculer le thème">
                <svg class="icon-sun" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
                <svg class="icon-moon" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
            </button>
        </div>
    </header>

    <!-- Main -->
    <main class="app-main">
        {% block content %}{% endblock %}
    </main>

    <!-- Footer -->
    <footer class="app-footer">
        &copy; 2026 DSI TRIMETA Group &middot; Direction des Systèmes d'Information
    </footer>

</body>
</html>

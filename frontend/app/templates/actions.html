{% extends "dashboard_base.html" %}

{% block dashboard_content %}
<div class="page-header anim-2">
    <h2 class="page-title">Actions</h2>
    <button class="btn btn-primary" style="padding: 6px 12px; font-size: 13px;">
        <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        Nouvelle Action
    </button>
</div>

<div class="anim-3">
    <div class="empty-state" style="margin-top: 24px;">
        <svg fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24" style="width: 48px; height: 48px; margin: 0 auto 12px; color: var(--border-default);"><path d="M12 20V10"/><path d="M18 20V4"/><path d="M6 20v-4"/></svg>
        <p>Aucune action n'est enregistrée pour le moment.</p>
    </div>
</div>
{% endblock %}

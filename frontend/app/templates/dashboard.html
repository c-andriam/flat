{% extends "dashboard_base.html" %}

{% block dashboard_content %}
<div class="page-header anim-2">
    <h2 class="page-title">Vue d'ensemble</h2>
</div>

<!-- Mini Stats Grid -->
<div class="stat-grid anim-3" style="gap: 16px;">
    <div class="stat-card" style="padding: 16px;">
        <div class="stat-label">Projets actifs</div>
        <div class="stat-value" style="font-size: 24px;">—</div>
    </div>
    <div class="stat-card" style="padding: 16px;">
        <div class="stat-label">Actions en cours</div>
        <div class="stat-value" style="font-size: 24px;">—</div>
    </div>
    <div class="stat-card" style="padding: 16px;">
        <div class="stat-label">Actions en retard</div>
        <div class="stat-value" style="font-size: 24px; color: var(--accent-orange);">—</div>
    </div>
    <div class="stat-card" style="padding: 16px;">
        <div class="stat-label">Échéances proches</div>
        <div class="stat-value" style="font-size: 24px; color: var(--accent-red);">—</div>
    </div>
</div>

<!-- Empty Recent Projects Table -->
<div class="anim-4" style="margin-top: 32px;">
    <h3 style="font-size: 16px; font-weight: 600; margin-bottom: 12px; color: var(--text-primary);">Derniers Projets Mis à Jour</h3>
    <div class="empty-state">
        <svg fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24" style="width: 48px; height: 48px; margin: 0 auto 12px; color: var(--border-default);"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
        <p>Aucun projet récent à afficher.</p>
    </div>
</div>

<!-- Empty Recent Actions -->
<div class="anim-4" style="animation-delay: 0.1s; margin-top: 32px;">
    <h3 style="font-size: 16px; font-weight: 600; margin-bottom: 12px; color: var(--text-primary);">Actions Prioritaires</h3>
    <div class="empty-state">
        <svg fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24" style="width: 48px; height: 48px; margin: 0 auto 12px; color: var(--border-default);"><path d="M12 20V10"/><path d="M18 20V4"/><path d="M6 20v-4"/></svg>
        <p>Aucune action prioritaire en attente.</p>
    </div>
</div>
{% endblock %}

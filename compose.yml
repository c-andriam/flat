version: '3.8'

networks:
  dsio-internal-net:
    driver: bridge
    name: dsio-internal-net

volumes:
  postgres_data:
    name: dsio_postgres_data
  redis_data:
    name: dsio_redis_data

services:

  # =========================================================================
  # 🗄️ 4. LA COUCHE INFRASTRUCTURE (Base de données & Message Broker)
  # =========================================================================

  # Service 9 : Base de données PostgreSQL (Source de Vérité)
  postgres:
    image: postgres:16-alpine
    container_name: dsio-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - dsio-internal-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Service 10 : File de messages et Pub/Sub Redis
  redis:
    image: redis:7-alpine
    container_name: dsio-redis
    restart: always
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - dsio-internal-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # =========================================================================
  # 🧠 2. LA COUCHE MÉTIER (APIs Synchrones FastAPI)
  # =========================================================================

  # Service 4 : Auth & Identity API (SSO Microsoft MSAL & RBAC)
  auth-api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dsio-auth-api
    restart: always
    command: uvicorn app.auth_main:app --host 0.0.0.0 --port 8001
    env_file:
      - .env
    volumes:
      - ./backend/alembic/versions:/app/alembic/versions
    networks:
      - dsio-internal-net
    depends_on:
      postgres:
        condition: service_healthy

  # Service 3 : Core API (CRUD Projets, Actions & Audit Logs)
  core-api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dsio-core-api
    restart: always
    command: uvicorn app.core_main:app --host 0.0.0.0 --port 8000
    env_file:
      - .env
    volumes:
      - ./backend/alembic/versions:/app/alembic/versions
    networks:
      - dsio-internal-net
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Service 5 : Real-Time Hub (WebSockets & Diffusion Temps Réel)
  realtime-hub:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dsio-realtime-hub
    restart: always
    command: uvicorn app.ws_main:app --host 0.0.0.0 --port 8002
    env_file:
      - .env
    networks:
      - dsio-internal-net
    depends_on:
      redis:
        condition: service_healthy

  # =========================================================================
  # ⚙️ 3. LA COUCHE ASYNCHRONE (Workers Celery & Scheduler)
  # =========================================================================

  # Service 6 : Ingestion & Webhook Worker (Lecture SharePoint -> BDD)
  worker-ingestion:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dsio-worker-ingestion
    restart: always
    command: celery -A app.workers.celery_app worker -Q ingestion_queue --loglevel=info
    env_file:
      - .env
    volumes:
      - ./backend/alembic/versions:/app/alembic/versions
    networks:
      - dsio-internal-net
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Service 7 : Write-Back Worker (Miroir BDD -> SharePoint par Ancre)
  worker-writeback:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dsio-worker-writeback
    restart: always
    command: celery -A app.workers.celery_app worker -Q writeback_queue --loglevel=info
    env_file:
      - .env
    volumes:
      - ./backend/alembic/versions:/app/alembic/versions
    networks:
      - dsio-internal-net
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Service 8 : Notification & Cron Scheduler (Moteur de relance Outlook)
  scheduler-notifications:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dsio-scheduler-notifications
    restart: always
    command: celery -A app.workers.celery_app beat --loglevel=info
    env_file:
      - .env
    volumes:
      - ./backend/alembic/versions:/app/alembic/versions
    networks:
      - dsio-internal-net
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # =========================================================================
  # 🌐 1. LA COUCHE D'EXPOSITION (Frontend & Reverse Proxy)
  # =========================================================================

  # Service 2 : Frontend UI (React / Vue + TailwindCSS)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: dsio-frontend
    restart: always
    networks:
      - dsio-internal-net

  # Service 1 : API Gateway / Reverse Proxy (Nginx)
  gateway:
    image: nginx:alpine
    container_name: dsio-gateway
    restart: always
    ports:
      - "8080:80"
      - "8443:443"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/nginx.conf:ro,Z
    networks:
      - dsio-internal-net
    depends_on:
      - frontend
      - core-api
      - auth-api
      - realtime-hub

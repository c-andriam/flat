networks:
  dsio-internal-net:
    driver: bridge
    name: dsio-internal-net

volumes:
  redis_data:
    name: dsio_redis_data

services:

  # =========================================================================
  # 🗄️ 4. LA COUCHE INFRASTRUCTURE (Message Broker)
  # NOTE : PostgreSQL est hébergé sur Supabase (voir POSTGRES_HOST dans .env),
  # pas de conteneur Postgres local nécessaire.
  # =========================================================================

  # Service 10 : File de messages et Pub/Sub Redis
  redis:
    image: redis:7-alpine
    container_name: dsio-redis
    restart: always
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - dsio-internal-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # =========================================================================
  # 🧠 2. LA COUCHE MÉTIER (APIs Synchrones FastAPI)
  # =========================================================================

  # Service 4 : Auth & Identity API (SSO Microsoft MSAL & RBAC)
  auth-api:
    build:
      context: ./backend
      dockerfile: Dockerfile
      network: host
    container_name: dsio-auth-api
    dns:
      - 10.89.0.1
      - 1.1.1.1
      - 8.8.8.8
    restart: always
    command: uvicorn app.auth_main:app --host 0.0.0.0 --port 8001
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8001/health', timeout=5).status == 200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    env_file:
      - .env
    volumes:
      - ./backend/alembic/versions:/app/alembic/versions:z
    networks:
      - dsio-internal-net

  # Service 3 : Core API (CRUD Projets, Actions & Audit Logs)
  core-api:
    build:
      context: ./backend
      dockerfile: Dockerfile
      network: host
    container_name: dsio-core-api
    dns:
      - 10.89.0.1
      - 1.1.1.1
      - 8.8.8.8
    restart: always
    command: uvicorn app.core_main:app --host 0.0.0.0 --port 8000
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health', timeout=5).status == 200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    env_file:
      - .env
    volumes:
      - ./backend/alembic/versions:/app/alembic/versions:z
    networks:
      - dsio-internal-net
    depends_on:
      redis:
        condition: service_healthy

  # Service 5 : Real-Time Hub (WebSockets & Diffusion Temps Réel)
  realtime-hub:
    build:
      context: ./backend
      dockerfile: Dockerfile
      network: host
    container_name: dsio-realtime-hub
    dns:
      - 10.89.0.1
      - 1.1.1.1
      - 8.8.8.8
    restart: always
    command: uvicorn app.ws_main:app --host 0.0.0.0 --port 8002
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8002/health', timeout=5).status == 200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    env_file:
      - .env
    networks:
      - dsio-internal-net
    depends_on:
      redis:
        condition: service_healthy

  # =========================================================================
  # ⚙️ 3. LA COUCHE ASYNCHRONE (Workers Celery & Scheduler)
  # =========================================================================

  # Service 6 : Ingestion & Webhook Worker (Lecture SharePoint -> BDD)
  worker-ingestion:
    build:
      context: ./backend
      dockerfile: Dockerfile
      network: host
    container_name: dsio-worker-ingestion
    dns:
      - 10.89.0.1
      - 1.1.1.1
      - 8.8.8.8
    restart: always
    # `notifications_queue` est consommee ici : le beat publie les relances
    # quotidiennes, et aucun autre conteneur n'ecoute cette file.
    command: celery -A app.workers.celery_app worker -Q ingestion_queue,notifications_queue --loglevel=info
    env_file:
      - .env
    volumes:
      - ./backend/alembic/versions:/app/alembic/versions:z
    networks:
      - dsio-internal-net
    depends_on:
      redis:
        condition: service_healthy

  # Service 7 : Write-Back Worker (Miroir BDD -> SharePoint par Ancre)
  worker-writeback:
    build:
      context: ./backend
      dockerfile: Dockerfile
      network: host
    container_name: dsio-worker-writeback
    dns:
      - 10.89.0.1
      - 1.1.1.1
      - 8.8.8.8
    restart: always
    command: celery -A app.workers.celery_app worker -Q writeback_queue --loglevel=info
    env_file:
      - .env
    volumes:
      - ./backend/alembic/versions:/app/alembic/versions:z
    networks:
      - dsio-internal-net
    depends_on:
      redis:
        condition: service_healthy

  # Service 8 : Notification & Cron Scheduler (Moteur de relance Outlook)
  scheduler-notifications:
    build:
      context: ./backend
      dockerfile: Dockerfile
      network: host
    container_name: dsio-scheduler-notifications
    dns:
      - 10.89.0.1
      - 1.1.1.1
      - 8.8.8.8
    restart: always
    command: celery -A app.workers.celery_app beat --loglevel=info
    env_file:
      - .env
    volumes:
      - ./backend/alembic/versions:/app/alembic/versions:z
    networks:
      - dsio-internal-net
    depends_on:
      redis:
        condition: service_healthy

  # =========================================================================
  # 🌐 1. LA COUCHE D'EXPOSITION (Frontend & Reverse Proxy)
  # =========================================================================

  # Service 2 : Frontend UI (React / Vue + TailwindCSS)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      network: host
    container_name: dsio-frontend
    user: "root"
    restart: always
    command: sh -c "tailwindcss -i ./app/static/css/input.css -o ./app/static/css/output.css --minify && uvicorn app.main:app --host 0.0.0.0 --port 80 --reload"
    volumes:
      - ./frontend/app:/app/app:z
    networks:
      - dsio-internal-net

  # Service 1 : API Gateway / Reverse Proxy (Nginx)
  gateway:
    image: nginx:alpine
    container_name: dsio-gateway
    restart: always
    ports:
      - "8080:80"
      - "8443:443"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/nginx.conf:ro,Z
      - ./gateway/certs:/etc/nginx/certs:ro,Z
    networks:
      - dsio-internal-net
    depends_on:
      frontend:
        condition: service_started
      core-api:
        condition: service_healthy
      auth-api:
        condition: service_healthy
      realtime-hub:
        condition: service_healthy

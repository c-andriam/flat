events { worker_connections 1024; }

http {
    upstream frontend_svc { server frontend:80; }
    upstream core_api_svc { server core-api:8000; }
    upstream auth_api_svc { server auth-api:8001; }
    upstream ws_hub_svc   { server realtime-hub:8002; }

    # Taille max upload (fichiers Excel SharePoint)
    client_max_body_size 50M;

    server {
        listen 80;

        # Routage Interface Utilisateur
        location / {
            proxy_pass http://frontend_svc;
        }

        # Routage API Authentification (SSO)
        location /api/v1/auth {
            proxy_pass http://auth_api_svc;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Routage API Métier (CRUD Projets/Actions)
        location /api/v1/ {
            proxy_pass http://core_api_svc;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Routage REST du service temps réel (docs Swagger, health check)
        location /api/v1/realtime {
            proxy_pass http://ws_hub_svc;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Routage WebSockets (Temps Réel)
        location /ws {
            proxy_pass http://ws_hub_svc;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}

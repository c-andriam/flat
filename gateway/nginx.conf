events { worker_connections 1024; }

http {
    # Types MIME : sans ce include, nginx sert tout le statique en
    # application/octet-stream et le navigateur refuse d'appliquer le CSS.
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Ne pas annoncer la version de nginx dans les en-têtes ni les pages
    # d'erreur (réduit la surface d'information pour un scan).
    server_tokens off;

    sendfile on;
    keepalive_timeout 65;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1024;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" rt=$request_time '
                    'rid=$upstream_http_x_request_id';
    access_log /var/log/nginx/access.log main;

    upstream frontend_svc { server frontend:80; }
    upstream core_api_svc { server core-api:8000; }
    upstream auth_api_svc { server auth-api:8001; }
    upstream ws_hub_svc   { server realtime-hub:8002; }

    # Taille max upload (fichiers Excel SharePoint)
    client_max_body_size 50M;

    # Première ligne de défense sur le SSO : le rate limiting applicatif
    # (slowapi) est en mémoire par process, celui-ci s'applique avant même
    # d'atteindre Python.
    limit_req_zone $binary_remote_addr zone=auth_zone:10m rate=30r/m;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # --- HTTP : redirection vers HTTPS ---
    # Un bloc dédié remplace le `if ($scheme != "https")` qui cohabitait avec
    # le listen 443 : plus lisible, et les health checks internes restent
    # joignables en clair sur le réseau Docker (voir /health ci-dessous).
    server {
        listen 80;

        # Les sondes container-à-container et la suite de tests d'intégration
        # passent par le réseau interne, où le certificat auto-signé
        # « localhost » ne peut pas être validé : on ne les redirige pas.
        location = /health {
            proxy_pass http://core_api_svc/health;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # --- HTTPS ---
    server {
        listen 443 ssl;
        http2 on;

        ssl_certificate /etc/nginx/certs/localhost.pem;
        ssl_certificate_key /etc/nginx/certs/localhost-key.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;

        # --- En-têtes de sécurité ---
        # HSTS : à n'activer qu'une fois le certificat de production en place
        # (avec un certificat auto-signé, il verrouille le navigateur sur une
        # connexion qu'il refusera).
        # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

        # Routage Interface Utilisateur
        location / {
            proxy_pass http://frontend_svc;
        }

        # Routage API Authentification (SSO)
        location /api/v1/auth {
            limit_req zone=auth_zone burst=10 nodelay;
            proxy_pass http://auth_api_svc;
        }

        # Routage REST du service temps réel (docs Swagger, health check)
        location /api/v1/realtime {
            proxy_pass http://ws_hub_svc;
        }

        # Routage API Métier (CRUD Projets/Actions)
        location /api/v1/ {
            proxy_pass http://core_api_svc;
        }

        # Routage WebSockets (Temps Réel)
        location /ws {
            proxy_pass http://ws_hub_svc;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            # Sans ces délais, nginx ferme la WebSocket au bout de 60 s
            # d'inactivité (proxy_read_timeout par défaut) : le tableau de
            # bord perdait le temps réel dès qu'aucun événement ne circulait.
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }
    }
}
